name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.18-alpine
        env:
          POSTGRES_USER: aryon
          POSTGRES_PASSWORD: aryon
          POSTGRES_DB: aryondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aryon -d aryondb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go-server/go.sum

      - name: Install migration tool
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Apply migrations
        run: migrate -path postgres/migrations -database 'postgresql://aryon:aryon@localhost:5432/aryondb?sslmode=disable' up

      - name: Verify formatting
        run: test -z "$(gofmt -l go-server)"

      - name: Run tests with race detector and coverage
        working-directory: go-server
        env:
          TEST_DATABASE_URL: postgresql://aryon:aryon@localhost:5432/aryondb?sslmode=disable
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce 50% coverage
        working-directory: go-server
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 50) exit 1 }'

      - name: Build
        working-directory: go-server
        run: go build ./cmd/api

      - name: Scan reachable Go vulnerabilities
        working-directory: go-server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: go-server

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Lint and verify Python formatting
        run: |
          ruff check --config tests/pyproject.toml tests
          ruff format --config tests/pyproject.toml --check tests

      - name: Start stack
        run: docker compose up -d --build --wait

      - name: Run supplied tests
        run: python tests/run_tests.py

      - name: Run extended tests
        run: pytest -q tests/test_hierarchy.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build

      - name: Scan Go image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --scanners vuln --skip-version-check \
            aryonsecuritycloudhomeassignment-go-server:latest

      - name: Scan PostgreSQL image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --scanners vuln --skip-version-check \
            aryonsecuritycloudhomeassignment-postgres:latest

      - name: Scan migration image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --scanners vuln --skip-version-check \
            aryonsecuritycloudhomeassignment-migrate:latest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner
